# 研究简报 —— agent-serving-bench

question: "当 coding agent 被放到「设计推理服务系统」这个位置上，它到底能不能干、干成什么样、谁来判它干成了？"

scope:
  topic: "agent-serving-bench"
  region: global
  language: zh-en
  # 这条线从 KernelBench（2025-02）算起，到 ServerBench（2026-11）形成一个完整的问题谱
  time_range: "2025-02 ～ 2026-11"
as_of: 2026-11-05
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  boundary: |
    ServerBench 是一个具体的基准，不是一整条线。要研究它，必须把它放回它自己划出的谱系里：

    - 同一年出现了三个「让 agent 造服务系统」的系统（VibeServe、SEIS、ServerBench），
      但只有 ServerBench 把它做成了**可比较的基准**；
    - 同一年也出现了四个「agent 改推理代码」的基准（ISO-Bench、SWE-Serve、InfraDev、InferenceBench），
      它们的任务尺度比 ServerBench 小一级（补丁 / 仓库任务 / 单引擎优化）；
    - 还有一条「测量可信度」的线（AutoTuneBench、KernelBench-Verified），
      它问的是同一个问题的另一面：**你怎么知道你测到的提升是真的**。

    站内已有 rsi-quant / rsi-serving / rsi-inference 三篇，但它们的对象是「优化技术本身」；
    这一篇的对象是「让 agent 去做优化的那个评测装置」。这是另一个东西：
    前者的失败模式是「方法不通用」，后者的失败模式是「量错了」。

  core_claim_to_test: |
    一句话假设：**这条线已经从「造一个更快的实现」转向「造一个能被独立验证的系统」，
    而转折点正是评测装置本身——谁定目标函数、谁定验证方式，决定了 agent 学到什么。**

    具体地，本文要检验三条：

        (a) 目标函数从「相对基线的加速比」换成「单位 GPU 成本的合格价值」后，
            agent 的行为从「压延迟」变成「协调容量与并发」，这可以被轨迹观察到；
        (b) 验证强度决定交付率：验证只查正确性时，agent 会交付在部署负载下崩掉的系统；
        (c) 因此这条线的真正瓶颈不是 agent 的搜索能力，而是**评测装置的构造难度**——
            测试与提示必须一起合成，否则两个方向都会误判。

subquestions:
  - id: q1
    question: "ServerBench 到底做了什么？它的目标函数、负载、验证各自解决什么问题？"
    why: |
      它的三个设计与别人不同，必须逐个说清，否则会把它当成「又一个 KernelBench」。
      目标函数尤其关键：dollars per dollar 不是加速比的变体，它把「服务多少负载」
      变成了 agent 的决策变量，这一点改变了整个优化问题的形状。
    expected_evidence: "目标函数定义式、延迟档位标定方式、回放负载来源、验证清单"
    done_when: "能用一段话说清三个设计各自堵住了哪个缺口"
    status: unanswered

  - id: q2
    question: "同类的「agent 造/改推理系统」工作有哪些，它们的任务尺度差几级？"
    why: |
      这条线上至少四种尺度：单个 kernel（KernelBench）、一个优化补丁（ISO-Bench）、
      一个仓库级功能（SWE-Serve / InfraDev）、一整套服务系统（ServerBench）。
      尺度不同，判据也不同——补丁用测试，系统用端到端回放。混着比会得出错误的强弱结论。
    expected_evidence: "任务数量、任务来源、判分方式、是否端到端"
    done_when: "能画出一张按任务尺度排序的表，并指出每级的判据形状"
    status: unanswered

  - id: q3
    question: "这条线上报告的增益有多大，各家的口径是否可比？"
    why: |
      各家的基线完全不同：有的相对 vLLM 默认配置，有的相对调优后的 SGLang，
      有的相对朴素 PyTorch。同一个「4.87 倍」在不同口径下含义完全不同。
    expected_evidence: "每篇的基线定义、增益数字、口径说明"
    done_when: "能给出至少 6 条带基线标注的增益，并说明哪些不可直接比较"
    status: unanswered

  - id: q4
    question: "失败模式是什么？为什么 agent 造的系统会通不过验证？"
    why: |
      ServerBench 自己给了很具体的三类失败：容量与并发不协调、反馈解读脱离负载、
      验证覆盖不到新引入的执行路径。这三条与别的基准报的失败（收敛太快、
      奖励黑客、正确但没优化）不是同一批。
    expected_evidence: "逐条失败案例、失败计数、以及别的基准报的失败类型"
    done_when: "能列出至少 5 种失败模式，每种有具体案例或计数"
    status: unanswered

  - id: q5
    question: "测量本身可信吗？有没有人证明这些增益是测量伪影？"
    why: |
      这条线上已经出现了两篇专门打假的论文（AutoTuneBench、KernelBench-Verified）。
      如果不处理这一层，前面所有增益数字都要打折。
    expected_evidence: "四种失效模式、TF32 基线与隐藏测试的效果、被打回后的真实倍数"
    done_when: "能给出「同一结果在诚实基线下缩水多少」的具体数字"
    status: unanswered

  - id: q6
    question: "这条线与「让 agent 自我改进推理系统」是什么关系？"
    why: |
      SEIS 自称 self-evolving，ServerBench 自称 benchmark。两者其实在回答同一个问题的两面：
      前者问「能不能越改越好」，后者问「改好了没有谁来判」。
      把两者放在一起，才能回答「这条线离 RSI 还有多远」。
    expected_evidence: "SEIS 的会话继承机制与增益、ServerBench 的交付率与验证覆盖率"
    done_when: "能指出这条线在「自动化」与「自我改进」之间的确切位置"
    status: unanswered

constraints:
  source_priority: [academic, code, official]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 140
    max_minutes: 120

exclusions:
  - "把 ServerBench 当成「又一个加速比基准」：它的目标函数不是加速比"
  - "跨口径直接比较增益倍数"
  - "忽略测量可信度那一层"
