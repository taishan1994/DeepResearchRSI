# 研究简报 —— 一键多平台发布

question: "有没有工具能把一篇文章「一键」发到知乎、微信公众号、小红书？「一键」在每一层（平台官方接口 / 第三方工具 / 浏览器登录态）分别落到哪里，覆盖哪些平台，代价与边界是什么？"

scope:
  topic: "中文内容平台的多平台分发：官方发布能力、开源/商业工具的实现机制与能力边界"
  region: "zh-CN（含少量海外对照）"
  language: zh-en
  time_range: "2022（ArtiPub 旧版）～2026-11-09（信息截止）"
as_of: 2026-11-09
freshness: 30d
deliverable: comparison

why_this_topic:
  boundary: |
    站内已有 rtx-pro-6000 / pro6000se-dsv41 这类「硬件与系统」归档，本主题换到
    「内容分发的工程可行性」，问法沿用同一套：不是「哪个工具好用」，而是
    **这个能力在哪一层被真正提供、哪一层只是转述**。
  core_claim_to_test: |
    一句话假设：所谓「一键多平台发布」，平台侧只在微信公众号有一段真正的服务端
    接口（草稿写入 + 发布提交）；知乎与小红书在官方层面**没有**内容发布 API。
    因此所有「一键发知乎/小红书」的工具，其真实机制都是**复用浏览器登录态去调
    各平台的 Web 编辑器接口**，而不是调开放平台。
    若成立，则「支持平台数」是维护成本的代理指标而非能力指标，且「一键」的终点
    通常是草稿箱而不是发布。

constraints:
  source_priority: [official, vendor, community, review, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 120
    max_minutes: 60

exclusions:
  - "不评测工具的用户体验与性价比，只谈能力边界与实现机制"
  - "不给出「绕过风控」的做法；平台限制按官方文档原样记录"
  - "不把厂商自述的「支持 N 个平台」当成已验证的能力（见 q3）"
  - "不采信无法定位原文的二手转述数字"

subquestions:
  - id: q1
    question: "平台官方层面，到底谁能被程序发布？微信公众号、知乎、小红书各自提供了什么？"
    why: |
      这是全篇的地基。如果三家都有发布 API，那「一键」就只是一个调度问题；
      如果只有一家有，那结论会完全不同。
    expected_evidence: "微信 draft/add 与 freepublish/submit 的官方文档；知乎开放平台的能力清单；小红书开放平台的 API 类目"
    done_when: "三家各有明确结论，且能指出各自文档中的具体条目"
    status: answered

  - id: q2
    question: "既然开放平台缺口这么大，「一键」是靠什么机制实现的？"
    why: |
      机制决定了风险归属：走官方 API 的失败是「授权过期」，走浏览器登录态的失败是
      「Cookie 失效 / 页面改版」。这两者的维护成本差一个量级。
    expected_evidence: "Wechatsync 的工作原理章节；multi-publisher 的 Playwright 登录；掘金 MCP 的 Cookie 方案；ArtiPub 从 Puppeteer 到 AI 的迁移说明"
    done_when: "能写出三类机制各自的鉴权方式、注入点与失效模式"
    status: answered

  - id: q3
    question: "「支持 29+ / 70+ 平台」这类数字可比吗？覆盖数的真实含义是什么？"
    why: |
      这是本主题最容易骗人的一格：不同厂商按视频/图文/文章分别计数，
      分母不统一，分子还是自述。
    expected_evidence: "各家官网与自述的数字；对统计口径差异的明确说明"
    done_when: "指出至少两处口径不一致，并说明「适配器数量」与「已实测数量」的区别"
    status: answered

  - id: q4
    question: "「一键」的终点是草稿箱还是发布？公众号的发布为什么是异步的？"
    why: |
      「发出去」与「存起来」是两种承诺。公众号的 freepublish 返回 errcode=0
      只代表任务提交成功，这与「文章已发布」差着一次异步审核。
    expected_evidence: "微信发布草稿文档的注意事项与事件推送说明；各工具对草稿/发布的默认值"
    done_when: "说清同步返回与异步结果的差别，以及哪些工具默认只存草稿"
    status: answered

  - id: q5
    question: "跨平台搬运内容时，有哪些硬约束会让人「一键」失败？"
    why: |
      这些约束是平台级的、无法用工具绕过：图片域名白名单、正文字符上限、
      不支持音视频。它们决定了「一键」在什么情况下必然需要人工介入。
    expected_evidence: "微信 draft/add 对 content 与图片 URL 的限制；各工具对音视频的支持说明"
    done_when: "至少列出 3 条硬约束，并各自指回官方文档或工具说明"
    status: answered

  - id: q6
    question: "代价与风险：风控、授权时效、维护成本分别落在谁身上？"
    why: |
      多平台分发不是无成本的复制。平台对同质内容有风控，工具的适配器会随页面改版失效，
      这两件事决定了它是「省时间」还是「把维护成本转移给你」。
    expected_evidence: "厂商对风控与授权过期的说明；适配器数量与实测数量的落差；开源许可"
    done_when: "分别给出风控、授权、维护三类成本的证据，并指出哪些是自述"
    status: answered
