# 研究简报 —— specpilot

question: "SpecPilot（arXiv 2611.02501）主张用 agent 循环自动发现无损投机解码的算法与系统优化：它的循环靠什么判据闭合、'无损'怎么被验证、增益有多大、边界在哪，以及公开源码里到底交付了什么、没交付什么？"

scope:
  topic: "specpilot"
  region: global
  language: zh-en
  # SpecPilot 是 2026-11-02 的 v1，评测硬件为 H100 与 RTX PRO 6000
  time_range: "2026-11-02 ～ 2026-11-05"
as_of: 2026-11-05
freshness: 7d
deliverable: deep_analysis

why_this_topic:
  boundary: |
    站内已有 kernel-agent / cuda-kernel-rl / pd-disagg 三篇相邻归档，都涉及
    「agent 在反馈里改系统」，但都不涉及投机解码，也不涉及「循环本身作为研究对象」。
    本文问的不是「哪个 kernel 更快」，而是：
      - 一个自动优化循环要什么判据才敢说「改进了」；
      - 当改进量只有几个百分点、且奖励容易被 hack 时，判据怎么设计；
      - 论文的机制与它放出来的代码之间差多少。
  core_claim_to_test: |
    一句话假设：SpecPilot 的核心贡献不是 W12 或 TLV 这些机制，而是
    **把「改进」变成一个可被脚本判定的量**——成本模型给出该往哪看（ceiling 的
    三个因子），控制器给出「是否晋级」（配对运行 + 95% 下界），token forcing
    给出「是否还无损」（teacher-forced 重打分 + 两条拒绝规则）。
    若成立，则机制是可替换的产物，判据才是可迁移的部分；反过来，若机制
    本身才是主要增益来源、判据只是包装，假设即失效。

subquestions:
  - id: q1
    question: "循环的形态与分工：每轮做什么、谁有权改系统、什么算晋级？"
    why: |
      自动优化系统的失败模式几乎都在「谁判定成功」上：agent 自评会漂，
      人评不可扩展。要看清楚 agent 与控制器的权限边界在哪一行代码上。
    expected_evidence: "论文对 Phase 0–4 的描述、晋级规则的具体阈值、sealed final 的定义"
    done_when: "能写出每轮的输入/输出与判定规则，并指出 agent 被禁止做什么"
    status: answered

  - id: q2
    question: "成本模型怎么把「该往哪优化」变成可计算的量？"
    why: |
      没有成本模型时，搜索会被最显眼的瓶颈吸住（本文的单 agent 对照就是）。
      ceiling 的三因子分解是这个系统区别于「多试几次」的关键。
    expected_evidence: "S=τ/c 的定义、ceiling 的因子分解、三轮中因子排序的变化"
    done_when: "能复述 ceiling 的构造与它在三轮里的指向变化，并给出证据"
    status: answered

  - id: q3
    question: "'无损'怎么被验证：为什么任务准确率不够，token forcing 的判据是什么？"
    why: |
      本文把 lossless 定义为「每个 token 都由精确权重的 argmax 决定」，但
      浮点归约顺序会改变近 tie 的 argmax——于是「逐位相同」会误杀，
      「准确率不降」会漏放。要看它用什么统计量替代。
    expected_evidence: "lossless 定义、stock 自身失配率、两条拒绝规则、注入故障实验"
    done_when: "能说明判据的零假设与两类错误，并指出它仍然漏掉什么"
    status: answered

  - id: q4
    question: "发现了什么机制：W12 / best-first tree / TLV / batching 各自怎么无损、增益多少？"
    why: |
      四个机制分别对应成本模型的三个因子与 batching 的行选择。要判断
      「判据驱动」还是「机制驱动」，必须逐机制看它是否由 ceiling 指向。
    expected_evidence: "机制描述、bit-exact 论证、逐次晋级增益表、消融/关闭方向表"
    done_when: "每个机制能给出无损论证与至少一个量化增益"
    status: answered

  - id: q5
    question: "增益有多大、口径是什么、哪些数字不可直接比？"
    why: |
      本领域最容易出错的地方：相对谁、几何均值、sealed 还是 bench、
      τ 在 TLV 下改了定义（每次 exact pass 而非每步）。口径不清的倍数没有意义。
    expected_evidence: "主表数字、口径说明、sealed vs bench 的偏差范围、复现表"
    done_when: "能给出至少 8 条带口径标注的增益，并指出至少三处不可比"
    status: answered

  - id: q6
    question: "边界与代价：什么情况下同一机制反号，循环本身多贵？"
    why: |
      发布偏差让负结果消失。本文自己给了三处反号（宽树、TLV、24-position
      block 在 batching 下变慢）与被关闭方向表，这是可用的边界证据。
    expected_evidence: "batching 下的负增益、被关闭方向及其测量依据、单轮成本表"
    done_when: "能给出至少三个使机制失效的条件，每个都有量化证据"
    status: answered

  - id: q7
    question: "源码审计：仓库交付了什么、没交付什么，复现要付出什么？"
    why: |
      论文的循环（控制器、记忆库、token forcing 判定）与仓库里能跑的东西
      不是一回事。不区分这两者，读者会把「6 个 setting 的引擎」当成「循环可用」。
    expected_evidence: "仓库结构、config 的开关数量、脚本职责、缺失模块的检索结果"
    done_when: "能逐项列出交付/未交付，并给出可复查的检索依据"
    # 已完成：交付边界（6 个引擎 + 脚本）、机制以 46–66 个环境开关交付、
    # 以及「仓库自证」的裁剪口——代码引用的 22 条路径里 10 条不存在
    # （knowledge 7 / validation 2 / autoresearch/replay.py 1）。
    # 仍未知：控制器与记忆库是否存在于私有分支，故不留 unanswered 但标注为
    # 「公开快照内的结论」。
    status: answered

constraints:
  source_priority: [academic, official, code, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 120
    max_minutes: 90

exclusions:
  - "把 SpecPilot 与同名项目（charleswagner 的 spec 驱动开发模板、Cwoolf91 的 Jira 插件）混为一谈"
  - "只读摘要就下结论：本文所有机制结论都要求读 §3–§6 与附录"
  - "把仓库 README 的数字当作独立复现：README 的复现表是作者自跑"
