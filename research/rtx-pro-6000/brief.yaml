# 研究简报 —— RTX PRO 6000 Blackwell 性能分析
question: "NVIDIA RTX PRO 6000 Blackwell 全系（Workstation / Max-Q / Server Edition）的真实性能如何？在 AI 推理、专业图形与渲染、科学计算三类负载上分别处于什么位置？相对 RTX 5090、上代 RTX 6000 Ada、L40S 与 H100 的性价比与适用边界在哪里？"
scope:
  topic: "NVIDIA RTX PRO 6000 Blackwell 系列 GPU 性能分析"
  region: global
  language: zh-en
  time_range: "2025-03（GTC 发布）～2026-10（信息截止）"
as_of: 2026-10-27
freshness: 30d
deliverable: deep_analysis
constraints:
  source_priority: [official, vendor, academic, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 120
    max_minutes: 60
exclusions:
  - "游戏性能不作为主线（仅在说明与 5090 差距时引用）"
  - "不采信无法定位原文的二手转述数字"
  - "不比较未公开发售的产品"

subquestions:
  - id: q1
    question: "三个 SKU（Workstation / Max-Q / Server Edition）的规格差异究竟是什么？"
    expected_evidence: "NVIDIA 官方产品页规格表 + 第三方评测交叉验证"
    done_when: "CUDA/Tensor/RT 核心数、显存、带宽、TDP、形态逐项有官方来源支持"
    status: answered

  - id: q2
    question: "同为核心数相同的 GB202，三个 SKU 的实际性能差异来自哪里？"
    expected_evidence: "功耗-频率扫描、pstate、显存时钟的实测数据"
    done_when: "能解释清楚差异来源（V/F 曲线、显存时钟、pstate），并有实测支撑"
    status: answered

  - id: q3
    question: "96GB 显存在实际 AI 负载中能承载什么规模的模型？"
    expected_evidence: "单卡实测吞吐表（模型/精度/上下文/并发）"
    done_when: "给出可运行的模型尺寸带与对应吞吐，标明精度与上下文条件"
    status: answered

  - id: q4
    question: "相对 RTX 5090 的性能与能效差距有多大？"
    expected_evidence: "同平台对比评测、指数化基准、功耗数据"
    done_when: "至少两个独立来源给出可比的倍数关系，且能解释口径差异"
    status: answered

  - id: q5
    question: "在专业图形/渲染（Blender、V-Ray、SPECviewperf 类）上的定位如何？"
    expected_evidence: "Blender Open Data 众测分数、Procyon/SPEC 类结果"
    done_when: "有可比较的公开分数并能说明与消费卡的差距"
    status: answered

  - id: q6
    question: "600W 是否值得？功耗墙与能效的最优点在哪里？"
    expected_evidence: "功耗限制扫描实验、每瓦性能数据"
    done_when: "给出不同功耗设置下的吞吐/能效曲线结论"
    status: answered

  - id: q7
    question: "价格与可获得性如何变化？当前采购成本处于什么水平？"
    expected_evidence: "发布时建议价、后续调价报道、渠道价格"
    done_when: "至少两个时间点的价格有来源，且标明币种与时点"
    status: answered

  - id: q8
    question: "软件栈与生态上有哪些限制或坑？"
    expected_evidence: "SM120 与 SM100 差异、驱动支持、量化格式实测"
    done_when: "列出已知限制（内核适配、量化交互、驱动缺口）并有来源"
    status: answered

  - id: q9
    question: "与 H100 / L40S / RTX 6000 Ada 相比，适用边界在哪里？"
    expected_evidence: "厂商对比数据 + 第三方实测 + 指数化基准"
    done_when: "给出'什么场景选它、什么场景不该选它'的可执行结论"
    status: answered
  - id: q10
    question: "MIG / vGPU 虚拟化下的表现如何？"
    expected_evidence: "NVIDIA vWS 选型指南的 SPECviewperf 与共享吞吐数据"
    done_when: "MIG 与时间切片的性能对比有官方来源，且给出共享扩展曲线"
    status: answered

  - id: q11
    question: "机密计算（CC）的性能代价有多大？"
    expected_evidence: "厂商基准 + 独立学术实测"
    done_when: "两套口径并列呈现，且能解释差异来源"
    status: answered

  - id: q12
    question: "长期高负载运行是否可靠？有无在役退化？"
    expected_evidence: "社区故障报告、厂商回应、RMA 记录"
    done_when: "症状、排除项、影响范围与缓解建议均可用来源支撑"
    status: answered
  - id: q13
    question: "部署新架构模型（如 Qwen3-Next）有哪些软件风险？"
    expected_evidence: "官方仓库 issue、可复现的错误信息与修复方案"
    done_when: "有明确指出问题范围、根因与绕过方案的实证"
    status: answered

  - id: q14
    question: "大规模自持部署的 TCO 如何？"
    expected_evidence: "第三方 TCO 模型与每芯片每小时成本"
    done_when: "给出持有型成本并能解释与零售价口径的差异"
    status: answered

  - id: q15
    question: "中国特供 RTX 6000D 的规格与定位？"
    expected_evidence: "拆解实测报告"
    done_when: "削减比例、实测性能与市场反应均有来源"
    status: answered

  - id: q16
    question: "视频编码能力有多强？"
    expected_evidence: "同行评议的编码实测"
    done_when: "给出吞吐、代价与适用场景的量化结论"
    status: answered

  - id: q17
    question: "MLPerf 官方封闭分区成绩如何？"
    expected_evidence: "第三方提交的白皮书或 MLCommons 结果页"
    done_when: "覆盖模型、配置与被测场景明确"
    status: answered

  - id: q18
    question: "长期高负载运行有哪些硬件风险？"
    expected_evidence: "社区故障报告、供电事故报道"
    done_when: "风险症状、证据强度与缓解措施齐备"
    status: answered

  - id: q19
    question: "产品生命周期与停产风险？"
    expected_evidence: "爆料与厂商公告"
    done_when: "明确标注证据等级，并说明对选型结论的影响"
    status: answered

  - id: q20
    question: "驱动要求与云上可用性？"
    expected_evidence: "NVIDIA 官方仓库、云厂商文档"
    done_when: "给出可执行的验证路径"
    status: answered
