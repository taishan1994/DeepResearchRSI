# 研究简报 —— rsi-quant

question: "模型量化的 RSI 走到了哪一步：谁能自动决定「压多少」，判据怎么闭合，为什么同一个量化配方换模型就失效？"

scope:
  topic: "rsi-quant"
  region: global
  language: zh-en
  # 量化从「手工调 bit」转向「自动分配」集中在 2024 之后，LLM 时代的方法学基本在 2025
  time_range: "2024-06 ～ 2026-11"
as_of: 2026-11-05
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  boundary: |
    站内已有三篇相邻归档，但都不覆盖量化：
    - rsi-inference 的对象是一段 GPU 程序，判据是一个数（比 PyTorch 快几倍）；
    - rsi-serving 的对象是整条推理链路，判据是一组统计量（配对运行下界、SLO）；
    - rsi-model-training 的对象是训练过程，判据是外部锚点上的分数。

    量化的对象是**权重与激活的表示**，它有一个前几篇都没有的性质：
    「更省」与「更准」是一对**连续可调**的权衡，而不是可分离的两件事。
    改一个 kernel 要么快要么慢，改一个 bit 数则是沿着一条前沿滑动。
    这决定了量化的判据必须同时是「前沿上的位置」与「前沿本身的形状」，
    而不只是一个阈值。

    故本文与前几篇的分工是：那几篇问「改得对不对」，这一篇问
    **「压到多少才算还正确」这个阈值是怎么定出来的，以及它能不能被自动定出来**。
  core_claim_to_test: |
    一句话假设：量化层的 RSI 卡在**判据的不可迁移性**上，而不是搜索能力上。
    具体地，量化的「无损」不是一个模型的属性，而是三元组
    (模型, 校准集, 评测集) 的属性；三者任一变动，同一个 bit 分配的结论就会翻转。
    因此量化的自动循环必须把「判据本身」当成被搜索对象的一部分：

        可晋级的量化方案 <=> 在留出的校准/评测划分上，退化 <= 阈值 且 该阈值可被重算

    若成立，则量化层的自动化创新应集中在**校准集构造、评测划分、阈值推导**，
    而不是 bit 分配的搜索算法；反过来，若某个系统的增益主要来自更聪明的搜索，
    假设即失效。

subquestions:
  - id: q1
    question: "量化的被优化对象与 kernel / 端到端层有什么结构差异？"
    why: |
      kernel 的对象是一段程序，端到端的对象是一条链路，量化的对象是**数值表示**。
      表示层的特殊性在于：它同时改变「算得多快」与「算得对不对」，而且两者
      沿同一条连续参数滑动。不先说清这一点，就会把「2-bit 比 4-bit 快」当成
      和「这个 kernel 比那个快」同一类命题。
    expected_evidence: "量化方法的对象定义、位宽/粒度/分组的选择空间、精度-效率前沿"
    done_when: "能给出量化层的对象分类，并说明每类的「正确」由什么定义"
    status: unanswered

  - id: q2
    question: "「无损」怎么定义：用什么指标、什么校准集、什么阈值？"
    why: |
      这是本文的核心。量化层的「无损」至少有三套互不兼容的定义：
      (a) perplexity 相对增量；
      (b) 下游任务准确率掉点；
      (c) 与 FP16 输出的逐 token 一致率。
      三者会给出相反的结论——一个方案可以 perplexity 几乎不变而 GSM8K 掉 10 点。
      故必须回答：这三套定义各自在保护什么，谁该被用来做晋级判据。
    expected_evidence: "论文里报告的指标组合、阈值来源、校准集规模与来源"
    done_when: "能列出三套定义各自的失效情形，并给出可执行的判据组合"
    status: unanswered

  - id: q3
    question: "循环的形态与权限边界：agent 能改什么，判定权在谁手里？"
    why: |
      量化的自动循环有一个其他层没有的诱惑：agent 可以自己挑校准集。
      一旦校准集与评测集重叠，循环就会「学到」一个不存在的无损。
      故权限边界的关键不是「能不能改量化配置」，而是「能不能碰评测数据」。
    expected_evidence: "流程阶段、agent 可调用的接口、被固定住的组件、校准与评测的隔离方式"
    done_when: "能写出每轮的输入/输出与判定规则，并指出 agent 被禁止碰什么"
    status: unanswered

  - id: q4
    question: "增益与代价：压到几位、换来多少，循环本身多贵？"
    why: |
      量化最容易出错的不是数字，是口径：相对 FP16 还是相对上一个量化基线、
      是权重-only 还是权重+激活、是显存还是吞吐、是单卡还是多卡。
      同时，量化循环自身的 GPU-小时（校准、搜索、恢复训练）必须计入。
    expected_evidence: "主表数字与口径说明、校准与搜索开销、恢复训练的 token 数"
    done_when: "能给出至少 8 条带口径标注的量化增益，并把循环成本折算进结论"
    status: unanswered

  - id: q5
    question: "边界在哪：什么条件下同一量化方案反号或不成立？"
    why: |
      量化层的反号比端到端更常见，因为它同时受模型规模、校准分布、
      任务类型三者影响。要找的是论文自己给出的反号证据：同一方法在小模型上
      有效、在大模型上失效；或在 perplexity 上无损、在推理任务上掉点。
    expected_evidence: "跨规模的反号、跨任务的反号、校准集敏感性实验"
    done_when: "能指出至少三个使量化方案失效的条件，每个都有量化证据"
    status: unanswered

  - id: q6
    question: "判据能迁移吗：量化层的判据工程能否用到别处？"
    why: |
      若结论只是「4-bit 够了」，这篇文章没有价值。可迁移的是判据的形状：
      阈值必须由基线噪声推导而不是拍定、校准集必须与评测集分离、
      退化必须同时看「平均」与「尾部」。
    expected_evidence: "多条独立工作的同向做法、反面案例（只报平均 perplexity 的工作）"
    done_when: "能给出可迁移的判据清单，并指出每一条的失效条件"
    status: unanswered

constraints:
  source_priority: [academic, code, official, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 160
    max_minutes: 130

exclusions:
  - "把「perplexity 不掉」当作无损：第 4 章专门给出反例"
  - "只报平均指标而不报尾部的量化工作被降级处理"
  - "把校准集上的结果当作泛化结论"
