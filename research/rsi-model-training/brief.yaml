# 研究简报 —— rsi-model-training

question: "模型训练中的 RSI（递归自我改进）究竟走到了哪一步，它的证据强度与失效机制是什么？"
scope:
  topic: rsi-model-training
  region: global
  language: zh-en
  time_range: "2022-01 ～ 2026-11"
as_of: 2026-11-05
freshness: 30d
deliverable: deep_analysis
constraints:
  source_priority: [academic, official, review, community]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 120
    max_minutes: 40
exclusions:
  - 具身智能 / 机器人策略的 RSI（另一条证据链，物理证据不可与文本基准直接比较）
  - 纯提示工程（在评测集上调提示但无自举闭环）
  - 只把「自我改进」当形容词的立场文与访谈
subquestions:
  - id: q1
    question: "「自我改进」在这批文献里指什么？能否拆成可比较的层次？"
    expected_evidence: "综述对词汇混用的诊断 + 各层代表工作的原文摘要"
    done_when: "给出分层口径，且每层至少两篇一手来源"
    status: answered
  - id: q2
    question: "奖励信号从哪里来？外部锚点是否在向内迁移？"
    expected_evidence: "各工作的奖励定义原文 + 本文对 27 篇权重层工作的编码统计"
    done_when: "统计可被 corpus_labels.csv 重算"
    status: answered
  - id: q3
    question: "零数据自举（不依赖人出题）是否成立？成立到什么程度？"
    expected_evidence: "Absolute Zero / R-Zero / Agent0 / SSR 的原文与量化结果"
    done_when: "至少三条独立工作，且能说清各自仍依赖什么"
    status: answered
  - id: q4
    question: "这些闭环的失效模式有哪些？是调参问题还是结构问题？"
    expected_evidence: "自我确认循环、Echo Trap、模型坍缩、Masked Erosion 的原文"
    done_when: "每类失效至少一条一手证据，并说明它属于哪一层"
    status: answered
  - id: q5
    question: "「改进」的证据强度如何？现有评测能否支撑 RSI 的声明？"
    expected_evidence: "对 114 篇全文编码的审计研究 + pass@k 反证 + 熵的证据"
    done_when: "给出可引用的比例，并说明分母"
    status: answered
  - id: q6
    question: "如果要实际使用这些方法，哪些层可以放开自动改，哪些不能？"
    expected_evidence: "验证器强度与可恢复性的定义 + 各层的回滚成本"
    done_when: "给出分层的操作建议，且每条建议能指回一条主张"
    status: partial
