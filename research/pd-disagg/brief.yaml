# 研究简报 —— pd-disagg

question: "PD 分离（Prefill-Decode disaggregation）用到哪些技术，不同模型的最佳实践分别是什么？"

scope:
  topic: "pd-disagg"
  region: global
  language: zh-en
  # DistServe / Splitwise 同期提出（2024 上半年），此后成为 serving 系统标配
  time_range: "2024-01 ～ 2026-11"
as_of: 2026-11-04
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  core_claim_to_test: |
    一句话假设：PD 分离的收益**不是一个固定倍数**，而由两项的乘积决定：
    「P 与 D 的资源画像差异」除以「KV 传输的可见成本」。
    当传输成本被完全隐藏（NVLink 同机、或分块流水），分离近乎白赚；
    当它暴露出来（跨机 RDMA、大 KV、高并发），分离可能为负。

    若成立，则「最佳实践」不应表述为一套推荐配置，而应表述为**一条判据**：
    分离只在「两阶段最优资源配比显著不同」且「KV 传输被隐藏」时成立。
    不同模型的差异，本质是这两项在不同模型上的取值不同。

    这个假设要能被推翻：若能找到「传输成本很高但分离仍然大幅正收益」的
    公开案例，或「资源画像接近但分离仍有收益」的案例，假设即失效。

subquestions:
  - id: q1
    question: "两阶段为什么值得分开：P 与 D 的资源画像差异有多大？"
    why: |
      这是分离的**唯一理由**。若两阶段的最优配置相同，分开只会多付传输成本。
      需要量化：算术强度、SM 占用、显存带宽压力、batch 上限各自受什么约束。
    expected_evidence: "论文里的 roofline / 实测吞吐曲线、SM 利用率、带宽占比"
    done_when: "能给出两阶段在至少两个维度上的量化差异，并说明它如何限制混部"
    status: unanswered

  - id: q2
    question: "KV cache 怎么搬：传输层有哪些技术，代价多少？"
    why: |
      分离把「一次本地写读」变成「跨进程/跨机传输」。传输层决定了
      分离是白赚还是倒贴。技术栈分档明显：同机 NVLink / 跨机 RDMA /
      经存储。延迟与带宽差一到两个数量级。
    expected_evidence: "具体的传输库（NIXL、LMCache、Mooncake Transfer Engine 等）、
      实测带宽与延迟、KV 大小计算公式"
    done_when: "能列出至少三档传输方案，并给出各档的实测带宽或延迟量级"
    status: unanswered

  - id: q3
    question: "怎么切分与调度：分块、分层、比例、抢占"
    why: |
      即使分开了，怎么切 prefill（chunked / layer-wise）、
      按什么比例分配 GPU、何时抢占，直接决定收益能否兑现。
    expected_evidence: "chunk size、layer-wise 流水、P:D 配比、调度策略描述"
    done_when: "能说明主流切分方式与调度策略，并指出各自的适用条件"
    status: unanswered

  - id: q4
    question: "不同模型的最佳实践：差异从哪来？"
    why: |
      这是本问的核心。模型差异体现在三处：KV 每 token 大小（MLA/GQA/MHA）、
      上下文长度、负载形态（长输入短输出 vs 短输入长输出）。
      三者共同决定 P:D 配比与是否需要分离。
    expected_evidence: "按模型给出的配置建议、实测对比、KV 大小对比"
    done_when: "能给出至少三类模型（如 MLA 系、GQA 系、MoE 系）的差异化做法"
    status: unanswered

  - id: q5
    question: "收益的边界在哪：什么时候不该分离？"
    why: |
      文献普遍报告正收益，但存在发布偏差——失败案例不会写成论文。
      需要主动找「分离不划算」的条件。
    expected_evidence: "论文里的负面结果、消融、或明确的使用条件声明"
    done_when: "能指出至少两个使分离失效的具体条件"
    status: unanswered

constraints:
  source_priority: [academic, official, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 150
    max_minutes: 70

exclusions:
  - "只讲 KV cache 压缩/量化而不涉及 P/D 分离的工作"
  - "通用 serving 调度但与 prefill/decode 区分无关的工作"
  - "「PD」指其他含义（如 product design、Parkinson's disease）"
  - "纯硬件评测且无分离机制的"
