# 研究简报 —— RTX PRO 6000 SE 部署 DeepSeek-V4.1-Flash

question: "在 NVIDIA RTX PRO 6000 Blackwell Server Edition 上部署 DeepSeek-V4.1-Flash 需要什么？要几张卡、什么软件栈、能跑多快、会踩什么坑？"
scope:
  topic: "RTX PRO 6000 Server Edition 上的 DeepSeek-V4.1-Flash 部署可行性、形状与代价"
  region: global
  language: zh-en
  time_range: "2026-09-10（V4.1-Flash 发布）～2026-11-05（信息截止）"
as_of: 2026-11-05
freshness: 30d
deliverable: deep_analysis

constraints:
  source_priority: [official, community, review, vendor, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 120
    max_minutes: 60

exclusions:
  - "不评测模型能力（MMLU/SWE-bench 等），只谈部署"
  - "不把 Max-Q / Workstation 的实测数当成 Server Edition 的数（本简报最重要的一条）"
  - "不采信无法定位原文的二手转述数字"

# 关键约束（先写清楚，因为它决定了整篇结论的边界）：
#
# 目标硬件是 **Server Edition**（1597 GB/s、被动散热、600W、无显存超频）。
# 而公开可得的三组实测全部来自 **Max-Q（325W、显存超频）** 或未标明变体的 96GB 卡。
# 因此本文的吞吐数字一律标注为「Max-Q 上测得，SE 上是推断」，并在第 6 章单列缺口。

subquestions:
  - id: q1
    question: "V4.1-Flash 的真实体积是多少？激活参数与总参数分别是多少？"
    expected_evidence: "模型卡 + 技术报告 + 权重体积的第三方测算"
    done_when: "552B/196B/8B/16B 四个数字各有 primary 来源，且 511GB 权重的来源标注为 secondary"
    status: answered

  - id: q2
    question: "一张 96GB 的 PRO 6000 能装下吗？最少要几张？"
    expected_evidence: "显存算术（权重 + KV + 激活 + 缓冲）与现场报告的实际占用"
    done_when: "给出 2/4/8 卡三档的可行性与各自的实测 VRAM 占用"
    status: answered

  - id: q3
    question: "Server Edition 与其它两个 SKU 的差别会不会影响部署结论？"
    expected_evidence: "NVIDIA 规格页（带宽/TDP/形态）+ 变体对照表"
    done_when: "指出带宽差 11%、无显存超频、被动散热三项，并说明哪些结论因此不能迁移"
    status: answered

  - id: q4
    question: "软件栈是什么？上游 vLLM/SGLang 能直接用吗？"
    expected_evidence: "官方 cookbook 的硬件矩阵 + 上游阻塞点的逐条记录"
    done_when: "能说清「为什么必须自带魔改镜像」以及两套栈各自的镜像"
    status: answered

  - id: q5
    question: "跑多快？预填、解码、长上下文分别是什么量级？"
    expected_evidence: "至少两组独立的实测吞吐，标明并发/上下文/精度"
    done_when: "预填、单流解码、并发解码、1M 冷预填四类各有数字且带条件"
    status: answered

  - id: q6
    question: "有哪些坑？哪些是静默失败？"
    expected_evidence: "现场报告的 pitfall 清单 + 各自的触发条件"
    done_when: "至少列出 5 个坑，并区分「报错」与「静默数值损坏」"
    status: answered

  - id: q7
    question: "自建还是用 API？"
    expected_evidence: "官方价目 + 实测吞吐 + 第三方盈亏平衡测算"
    done_when: "给出量级对比，并说明为何这不是同条件对照"
    status: answered
