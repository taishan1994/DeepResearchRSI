# 研究简报 —— kernel-agent

question: "kernel 生成智能体（agent）的前沿进展：当模型被放进「编译—测速—profiling」的反馈循环里，系统层面的设计进展在哪，瓶颈又在哪？"

scope:
  topic: "kernel-agent"
  region: global
  language: zh-en
  # 该方向 2025 年才成形：2025 之前只有零星的 code-gen 工作
  time_range: "2025-01 ～ 2026-10"
as_of: 2026-11-04
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  # 为什么单独写，而不是并入已有两篇
  boundary: |
    站内已有两篇相邻综述，本专题的角度与它们不同，必须说清楚，
    否则就是把旧素材重排：
      - cuda-kernel-gen：kernel「生成」的方法谱系，以模型与评测为中心。
      - cuda-kernel-rl   ：kernel 生成中的强化学习，以奖励设计为中心。
      - 本专题（kernel-agent）：系统层面——模型 + 工具 + 环境反馈 + 控制流。
        不问「模型怎么写出 kernel」，而问
        「系统怎么在编译、测速、profiling 的反馈下把 kernel 迭代到可用」。
  core_claim_to_test: |
    一句话假设：kernel 生成智能体的进展，几乎全部来自**把更多真实环境信号
    塞进循环**（编译器报错、测速数字、profiler 指标、硬件计数器），
    而很少来自更好的推理或更好的规划。
    若成立，则「智能体」在这个领域的含义比通常窄——它不是自主规划者，
    而是一个把环境信号转成下一步编辑的**反馈控制器**。

subquestions:
  - id: q1
    question: "智能体能观测到什么？——反馈信号的种类与保真度"
    why: |
      智能体的能力上限由它能看到的信号决定。只能看到「编译失败」和能看到
      「哪一行 L2 miss 高」，是两个不同的问题。
    expected_evidence: "论文里对反馈通道的描述、ablation、以及具体的工具名"
    done_when: "能列出至少 4 类反馈信号，并各有一篇 primary 来源支持"
    status: unanswered

  - id: q2
    question: "动作空间有多大？——从整文件重写到局部编辑"
    why: |
      动作空间决定搜索效率。整文件重写等于无梯度搜索；局部编辑需要
      定位能力。这是智能体设计里最容易被忽略、但对成本影响最大的一环。
    expected_evidence: "论文里对编辑粒度的描述、每轮 token 成本、收敛轮次"
    done_when: "能给出动作空间的谱系，并指出主流选择"
    status: unanswered

  - id: q3
    question: "轮次预算怎么花？——早停、剪枝与搜索"
    why: |
      每次测速都要真实执行，成本远高于一次前向。故「什么时候放弃」
      与「往哪个方向再试」直接决定单位成本下的产出。
    expected_evidence: "轮次上限、剪枝策略、best-of-n 的 n 值、成本对比"
    done_when: "能说明主流的预算分配方式，并有一处量化对比"
    status: unanswered

  - id: q4
    question: "失败怎么恢复？——错误归因与回退"
    why: |
      kernel 失败模式很结构化（编译错、超时、结果错、比基线慢）。
      能否把失败正确归因，决定下一轮是否有方向。
    expected_evidence: "对失败分类的处理、重试策略、回退机制"
    done_when: "能说明失败处理的做法，并指出被反复报告的具体失败模式"
    status: unanswered

  - id: q5
    question: "这些系统的收益是真的吗？——评测与作弊面"
    why: |
      智能体有更多自由度，也就有更多作弊面（改测试、少算、只挑好样本）。
      评测若不变，自由度只会放大噪声。
    expected_evidence: "benchmark 设计、反作弊机制、平凡基线"
    done_when: "能说明评测现状，并指出至少一处结构性缺陷"
    status: unanswered

constraints:
  source_priority: [academic, official, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 140
    max_minutes: 60

# 与相邻专题的既有来源允许重叠，但必须重新判定纳入理由
exclusions:
  - "用 RL 训练 kernel 生成模型、但推理时无工具/无环境反馈的工作（属 cuda-kernel-rl）"
  - "纯 benchmark 且不涉及智能体循环的工作（属 cuda-kernel-gen）"
  - "「kernel」指统计学核函数的工作（同名不同义）"
  - "用智能体做别的事、只是提到 kernel 一词的工作"
