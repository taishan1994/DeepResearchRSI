# 研究简报 —— code-to-video
question: "用「代码」作为中间表示来生成视频（code-as-video / code-to-video）这一族项目与论文：每个解决什么问题、优点与缺点是什么、框架结构如何、实验结果怎样，并做横向对比，写成一篇可投稿的综述论文。"

scope:
  topic: "以可执行程序（Manim / Blender Python / SVG / HTML-Canvas / 图形 DSL）为中间表示、由 LLM 或 agent 生成并渲染成视频的工作。与端到端像素生成模型（Sora / Veo 一类）相对照，但不以其为主体。"
  region: global
  language: zh-en
  time_range: "2023-01 ～ 2026-11"
as_of: 2026-11-18
freshness: 14d
deliverable: deep_analysis
constraints:
  source_priority: [academic, official, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 240
    max_minutes: 150

exclusions:
  - "纯端到端扩散/自回归视频生成模型（无代码中间表示）——只在第 1 章作对照提及"
  - "视频理解、视频检索、视频超分、deepfake 检测等以视频为输入的任务"
  - "纯 3D 资产生成（mesh / 3DGS）且不产出时间轴视频的工作"
  - "角色骨骼动画、动作捕捉等传统动画管线（无 LLM 参与）"

# 核心待检验论断：全篇围绕它组织，且可被反驳。
core_claim_to_test: >
  代码作为中间表示的价值，不在于画质，而在于它把「视频生成」转成了三个可判定的问题：
  可编译（语法与 API 正确）、可对齐（画面与意图一致）、可复现（同代码同输出）。
  这三条使得验证可以自动化，从而让闭环自我改进成为可能——这是端到端像素模型
  难以获得的能力。
  若能找到「以代码为中间表示、却仍无法自动验证」或「端到端模型在可验证性上追平」
  的公开反例，此论断即被削弱。

subquestions:
  - id: q1
    question: "这一族工作为什么选代码而不是像素？代码中间表示带来的具体能力与具体代价分别是什么？"
    expected_evidence: "各工作的 motivation 章节，以及其与端到端基线的对照实验"
    done_when: "能力与代价各有至少三条来自不同工作的原文依据"
    status: unanswered

  - id: q2
    question: "按「中间表示的类型」与「验证信号的来源」两个轴，这一族能排成怎样的谱系？"
    expected_evidence: "各工作的 method 章节：生成什么代码、用什么反馈"
    done_when: "至少 14 个工作被放到同一张双轴表上，每格有原文依据"
    status: unanswered

  - id: q3
    question: "每个代表工作解决什么问题、优缺点如何？缺点须来自其自陈 limitations 或第三方复现。"
    expected_evidence: "limitations 章节、消融实验、后续工作的反证、benchmark 结果"
    done_when: "每个纳入工作至少一条缺点证据可追溯"
    status: unanswered

  - id: q4
    question: "实验结果如何比较？渲染成功率、视觉质量、时间一致性、代码正确率这些指标在什么口径下成立？"
    expected_evidence: "各工作的评测协议、人评设置、使用的 benchmark"
    done_when: "给出至少三类口径差异，并说明哪些数字不可直接相减"
    status: unanswered

  - id: q5
    question: "这条线的天花板在哪？失败的典型形态是什么（语法错、几何错、时序错、审美错）？"
    expected_evidence: "benchmark 类工作（VibeVideoBench / PROWBench / ManiBench / AnimWeb-Bench）的失败分析"
    done_when: "给出失败形态的分类，且每类有至少一个 benchmark 的量化结果"
    status: unanswered
