# 研究简报 —— rsi-inference

question: "模型推理优化的 RSI（递归自我改进）走到了哪一步：改什么、反馈从哪来、增益与代价如何、边界在哪？"

scope:
  topic: "rsi-inference"
  region: global
  language: zh-en
  # LLM 驱动的推理栈自动优化集中在 2024 之后（KernelBench 2025-02 是分水岭）
  time_range: "2025-02 ～ 2026-11"
as_of: 2026-11-05
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  core_claim_to_test: |
    一句话假设：推理优化的 RSI，其**改进率**不是由「模型有多强」决定的，
    而是由「反馈信号的信噪比」决定的。具体地：

        DeltaPerf ~ f(信号可验证性) * g(搜索空间可分解性) / h(测量噪声)

    可验证性高（能编译、能跑对、能计时）的方向（kernel、算子、配置）
    能形成闭环；可验证性低（端到端延迟、成本、SLO）的方向只能形成
    「人给目标、agent 试」的半闭环。

    这个假设要能被推翻：若能找到「反馈极弱但改进率很高」的公开案例，
    或「反馈极强但改进率很低」的案例，假设即失效。

subquestions:
  - id: q1
    question: "推理优化的 RSI 到底在改什么：被优化的对象有哪几层？"
    why: |
      「推理优化」不是一件事。kernel/算子层、图与编译层、服务调度层、
      量化与压缩层，各自的可验证性与搜索空间形状完全不同。
      不先把对象分层，「RSI」这个词就会把四种不同的循环混为一谈。
    expected_evidence: "论文中被优化的对象定义、系统架构图描述、优化目标的量化指标"
    done_when: "能给出至少四层对象，并说明每层的判据（正确性怎么验、性能怎么测）"
    status: unanswered

  - id: q2
    question: "反馈信号从哪来，强度如何分级？"
    why: |
      这是核心假设的自变量。反馈可以是：编译通过/失败、单元测试、
      与基线的加速比、profiler 计数器、端到端 SLO。
      它们的信噪比差若干数量级，直接决定循环能否闭合。
    expected_evidence: "论文里对奖励/反馈的具体定义、验证器实现、噪声处理方式"
    done_when: "能给出一条分级（至少四级），并指出每级的失效模式"
    status: unanswered

  - id: q3
    question: "循环是怎么闭合的：搜索、强化学习、还是进化？"
    why: |
      「递归自我改进」有四种工程形态：单轮生成+验证、多轮反思、
      RL 训练、进化式种群搜索。它们的成本结构与收益曲线不同，
      混为一谈会让「RSI」变成空话。
    expected_evidence: "方法的伪代码、迭代次数、每轮成本、收敛曲线"
    done_when: "能区分至少三种循环形态，并给出各自的迭代预算与收敛证据"
    status: unanswered

  - id: q4
    question: "增益有多大，代价是什么：有没有可比的数字？"
    why: |
      本领域最容易造假的地方。需要收集：相对什么基线、什么统计口径、
      端到端还是 kernel 级、有没有把测量开销算进去。
    expected_evidence: "论文报告的加速比、几何平均口径、消融实验、成本数据"
    done_when: "能给出至少 8 条带口径标注的增益数字，并指出可比性缺陷"
    status: unanswered

  - id: q5
    question: "边界在哪：什么情况下这个循环不成立？"
    why: |
      文献有发布偏差，负结果不会写成论文。需要主动找：
      奖励黑客、端到端收益被 Amdahl 稀释、测量噪声大于改进量、
      以及「优化出来的东西不可维护」。
    expected_evidence: "负面结果、消融、隐藏测试集实验、端到端占比分析"
    done_when: "能指出至少三个使循环失效的具体条件，每个都有证据"
    status: unanswered

constraints:
  source_priority: [academic, official, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 200
    max_minutes: 140

exclusions:
  - "只做模型权重训练效率、与推理时优化无关的工作"
  - "纯硬件/体系结构论文，无自动优化循环"
  - "把「RSI」理解为其他含义（如 remote sensing image、repetitive strain injury）"
  - "只有一次性代码生成、没有验证反馈环节的工作"
