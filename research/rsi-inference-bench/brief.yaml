# 研究简报 —— rsi-inference-bench

question: "当推理栈本身成为 agent 的工作对象（补 day-0 模型支持、优化、修回归），谁来判它做成了？RSI-Inference Bench 在这一族里处在哪、缺什么？"

scope:
  topic: "rsi-inference-bench"
  region: global
  language: zh-en
  # 这一族从 MLE-bench（2024-10）的「跑 Kaggle」到 RSI-Inference Bench（2026-10）的
  # 「在真实引擎里加一个新模型的支持」，中间经过 PostTrainBench 把对象换成「训练」
  time_range: "2024-10 ～ 2026-11"
as_of: 2026-11-09
freshness: 30d
deliverable: deep_analysis

why_this_topic:
  boundary: |
    站内已有 rsi-inference / rsi-serving / rsi-quant 三篇，对象是「优化技术本身」；
    agent-serving-bench 的对象是「让 agent 造整套服务系统」。
    本篇的对象是**评测装置**，而且是一族此前从未入库的装置：ML 工程基准。

    这一族的共同形状是「给 agent 一个真实的、可执行的环境 + 一个下游指标，
    让它自己决定怎么做」，判据不是一段代码对不对，而是**交付物跑起来之后是多少**。

    为什么必须现在补：RSI-Inference Bench 的三条赛道里，
    Day-0 Model Support（10 题，pass/fail）是**唯一一个判据为二元的赛道**——
    这不是「快多少倍」，而是「能不能起来」。这与 rsi-inference 的结论
    「只有 kernel 层的循环真正闭合，因为只有这一层判据可被程序廉价判定」
    直接冲突：serving 层也存在一个廉价的二元判据，而且它已经被做成了基准。

  core_claim_to_test: |
    一句话假设：**这一族基准的判别力不来自任务难度，而来自「判据能不能被独立重跑」。**

    具体地，本文要检验三条：

        (a) 判据形状决定可自动化程度：二元（起不起来）> 比值（快多少倍）> 分数（下游指标涨多少）。
            RSI-Inference Bench 把这三档放在同一个基准里，故可以直接比。
        (b) 隐藏测试的作用不是提高难度，而是**阻断「改评测代码」这条捷径**；
            一旦判据可被 agent 读到，agent 就会去改判据而不是改实现。
        (c) 这条路线的真正成本不在任务构造，而在**每个任务都要能独立重建环境**
            （pinned commit + 离线 + 独立 verifier），这是它比论文基准贵一个量级的原因。

subquestions:
  - id: q1
    question: "RSI-Inference Bench 到底测什么：三条赛道的判据、预算、验证各是什么？"
    why: |
      它的三段式（day-0 支持 / 上线后优化 / 回归修复）对应一个模型在生产引擎里的
      完整生命周期。三段的判据形状不同，不分开说就会把它当成「又一个加速比基准」。
    expected_evidence: "赛道定义、题目数、pass@1 与 speed-up 的算法、verifier 做什么"
    done_when: "能用一段话说清三条赛道各自的判据形状，并指出哪条是二元判据"
    status: answered

  - id: q2
    question: "它在这一族里的位置：从 MLE-bench 到 PostTrainBench 到它，对象是怎么一路换的？"
    why: |
      这一族至少有四代对象：跑 Kaggle 竞赛（MLE-bench）、改 ML 研究工程（RE-Bench）、
      做后训练（PostTrainBench）、改推理引擎（RSI-Inference Bench）。
      对象每换一次，判据都要重造一次——这正是本文要追的线。
    expected_evidence: "每代的任务数、判据、预算、以及它相对上一代换了什么"
    done_when: "能画出一张按对象排序的表，并指出每代的判据形状"
    status: answered

  - id: q3
    question: "它报了什么结果？天花板在哪，天花板是能力问题还是判据问题？"
    why: |
      最好的 agent 在 Day-0 赛道只有 26.7% pass@1，且有 5 道题全场无人通过。
      这个分布本身是证据：如果失败集中在少数题上，说明是「这几道题的判据或环境有问题」，
      而不是「agent 普遍不行」。
    expected_evidence: "pass@1、每题通过数、f2p 部分通过率、无人通过的题号"
    done_when: "能区分「普遍不行」与「少数题卡死」，并给出支持后者的计数"
    status: answered

  - id: q4
    question: "为什么必须离线 + pinned commit + 独立 verifier？这三件事各堵住了哪条捷径？"
    why: |
      任务说明书明令禁止查上游历史、PR、issue、release notes 与模型 hub。
      这不是防作弊的礼貌措辞，而是这个基准能否成立的前提：
      这些题几乎都对应一条真实的上游合并修复，查得到就等于抄答案。
    expected_evidence: "任务书原文的禁止条款、oracle 的来源标注、guard 工作负载"
    done_when: "能逐条对上「某条禁令 -> 某条捷径 -> 若不堵会怎样」"
    status: answered

  - id: q5
    question: "它和「递归自我改进」是什么关系？名字里有 RSI，但循环闭合了吗？"
    why: |
      这一族里 PostTrainBench、RSI-Master、RSI-Dojo 都直接以 RSI 立论。
      但「agent 改进一个推理引擎」与「agent 改进自己」是两件事。
      必须把评测装置这一层单列，才能说清这条线离 RSI 还差哪一段。
    expected_evidence: "各篇对 RSI 的定义、循环里谁持有判定权、有无跨会话继承"
    done_when: "能指出这条线在「自动化」与「自我改进」之间的确切位置"
    status: partial

constraints:
  source_priority: [official, academic, code, community]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 160
    max_minutes: 150

exclusions:
  - "把 Day-0 的 pass@1 与 Optimization 的 speed-up 放在同一张柱状图里：两者不同量纲"
  - "跨基准直接比较增益倍数（各家基线与口径都不同）"
  - "把「agent 改推理引擎」等同于「agent 改自己」"
