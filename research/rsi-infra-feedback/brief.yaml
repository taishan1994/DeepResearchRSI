# 研究简报 —— rsi-infra-feedback
question: "与智谱《How GLM Built Its Own Inference Infrastructure》同类的、用 RSI/agent 自动优化推理与训练系统的论文与项目：每个都要说明它解决什么问题、优缺点、框架结构、实验结果，写成一篇可投稿的综述论文。"
scope:
  topic: "agent 驱动的基础设施自优化（inference / training systems），以「反馈如何被构造」为组织轴"
  region: global
  language: zh-en
  time_range: "2024-06 ～ 2026-11"
as_of: 2026-11-12
freshness: 30d
deliverable: deep_analysis
constraints:
  source_priority: [official, academic, review, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 240
    max_minutes: 120
exclusions:
  - "纯 kernel 生成、且不给系统级（端到端）结果的论文——已在 rsi-inference 归档中处理"
  - "纯硬件调优、无 LLM 参与的自动调参（传统 Bayesian / AutoTVM 搜索）"
  - "只有承诺、无可核对实验数字的厂商宣传"

# 核心待检验论断：全篇围绕它组织，并可被反驳。
core_claim_to_test: >
  智谱博客的真正贡献不是「agent 优化了推理系统」，而是把**反馈的构造**当成
  一等工程对象：它主张反馈的价值取决于三个属性——足够局部（local）、
  足够便宜及时（cheap & timely）、可客观验证（objectively verifiable）——
  而不是取决于反馈的数量或模型的强弱。
  若能在同类工作中找到「反馈不局部但改进率仍高」或「反馈极局部但改进率低」
  的公开反例，此论断即被削弱。

subquestions:
  - id: q1
    question: "智谱这套系统到底做了什么？其「密集反馈」三层（正确性 / 系统行为 / 性能）各自的判据、粒度与代价是什么？"
    expected_evidence: "z.ai 官方博客原文、唐杰公开陈述，以及其中提到的 PR 与数字"
    done_when: "三层反馈各有至少一条 primary 引用，且 3x 吞吐 / 两周 / 十万卡三个数字均落到原文"
    status: unanswered

  - id: q2
    question: "同类工作中，反馈被构造成什么形状？能否按「反馈的局部性 × 可验证性」把这一族排成谱系？"
    expected_evidence: "各工作的 framework 章节与其 feedback / verifier 设计"
    done_when: "至少 12 个工作被放到同一张判据表上，且每格取值有原文依据"
    status: unanswered

  - id: q3
    question: "每个代表工作解决什么问题、优点与缺点分别是什么？缺点须来自其自身实验或第三方复现，不能靠猜。"
    expected_evidence: "各工作的 limitations 章节、消融、以及后续工作的反证"
    done_when: "每个纳入工作都有一条「缺点」证据，且可追溯到原文或复现"
    status: unanswered

  - id: q4
    question: "实验结果的可比性如何？加速比、吞吐提升等数字在什么口径下成立，跨工作能否直接比较？"
    expected_evidence: "各工作的 baseline 定义、测量协议、硬件"
    done_when: "给出至少三类口径差异，并说明哪些数字不可直接相减"
    status: unanswered

  - id: q5
    question: "这条线离「递归自我改进」还差什么？瓶颈在生成侧还是验证侧？"
    expected_evidence: "各工作的失败模式，以及 benchmark 类工作对天花板的测量"
    done_when: "给出瓶颈判断，并指出至少一条能证伪它的证据"
    status: unanswered
