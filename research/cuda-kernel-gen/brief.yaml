# 研究简报 —— CUDA Kernel 自动生成前沿进展
question: "2025 年以来，大语言模型与智能体系统在 CUDA kernel 生成与优化上取得了哪些实质进展？这些进展在方法、评测与真实收益三个层面上分别处于什么位置，又各自被什么所限制？"
scope:
  topic: "LLM / Agent 驱动的 GPU kernel 生成与优化"
  region: global
  language: zh-en
  time_range: "2025-02（KernelBench 发布）～2026-11（信息截止）"
as_of: 2026-11-03
freshness: 30d
deliverable: deep_analysis
constraints:
  source_priority: [academic, official, vendor, community, press]
  citation_style: inline_markdown
  depth: deep
  budget:
    max_tool_calls: 150
    max_minutes: 90
exclusions:
  - "纯编译器工作（如 TVM / MLIR 改进）仅作对照，不作为主线"
  - "不采信无法回溯到 arXiv 摘要原文的性能数字"
  - "不比较未公开可复现的闭源系统"
  - "非 GPU 后端（NPU/TPU）仅在讨论可移植性时引用"

subquestions:
  - id: q1
    question: "这一领域的技术路线如何划分，各路线在 2026 年的态势如何？"
    expected_evidence: "SFT / RL / Agent 三条路线的代表工作及其演进脉络"
    done_when: "每条路线有至少 3 篇代表作，且能说明该路线为何兴起或退潮"
    status: answered

  - id: q2
    question: "论文报告的性能数字在多大程度上可信、可比？"
    expected_evidence: "对速度声明做统计分类，识别统计口径与基线配置的差异"
    done_when: "给出可跨论文比较的声明占比，并指出主要失真来源"
    status: answered

  - id: q3
    question: "性能数字被系统性夸大的机制是什么？"
    expected_evidence: "受控实验（同系统多基线、隐藏测试集）揭示的失真幅度"
    done_when: "能定量说明至少两种失真来源的幅度，并有独立复现支持"
    status: answered

  - id: q4
    question: "kernel 加速在真实负载上能转化为多少端到端收益？"
    expected_evidence: "真实负载剖析数据 + Amdahl 推算"
    done_when: "给出可优化时间占比的实测范围，并说明随规模变化的趋势"
    status: answered

  - id: q5
    question: "哪些问题仍未解决，且被现有评测体系系统性忽略？"
    expected_evidence: "批量不变性、可移植性、正确性保证强度等方面的证据"
    done_when: "至少指出三个不在现有基准覆盖范围内的失效维度"
    status: answered
